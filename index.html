<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/canvett-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070d18" />
    <meta name="description" content="Canvett is an AI-powered recruitment platform that ranks and vets candidates against a job using natural language processing, with a transparent, explainable score breakdown." />
    <script>
      // Set the theme before first paint to avoid a flash. The logged-out zone
      // (marketing + auth) is always dark; signed-in users get their saved theme.
      (function () {
        try {
          var token = localStorage.getItem('canvett_token');
          var stored = localStorage.getItem('canvett_theme');
          var dark = token ? (stored === 'dark') : true;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <title>Canvett—AI-Powered Resume Ranking</title>
    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Canvett" />
    <meta property="og:title" content="Canvett — AI-Powered Resume Ranking" />
    <meta property="og:description" content="Rank and vet candidates against a job with explainable, semantic match scores. Built for the Ghanaian recruitment context." />
    <meta property="og:image" content="/about-hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Canvett — AI-Powered Resume Ranking" />
    <meta name="twitter:description" content="Rank and vet candidates against a job with explainable, semantic match scores." />
    <meta name="twitter:image" content="/about-hero.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
