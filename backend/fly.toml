# fly.toml app configuration file generated for canvett-backend on 2026-09-29T02:38:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'canvett-backend'
primary_region = "fra"   # Frankfurt: co-located with the Neon database (eu-central-1)

[build]
[env]
  APP_ENV = 'production'
  HF_HOME = '/app/.hf'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
